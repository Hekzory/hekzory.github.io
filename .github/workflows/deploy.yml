# Builds the site on every push and PR; deploys dist/ to GitHub Pages on push to main.

name: Build & Deploy

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:
    inputs:
      indexnow_all:
        description: "Submit every sitemap URL to IndexNow, not just the changed ones"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      indexnow-urls: ${{ steps.indexnow.outputs.urls }}
    steps:
      - uses: actions/checkout@v7
        with:
          # full history so sitemap <lastmod> reflects real commit dates
          # (vite-plugin-sitemap.js falls back to build time on shallow clones)
          fetch-depth: 0
      # pnpm/setup installs pnpm and Node in one step and runs `pnpm install`
      # itself (frozen lockfile under CI). pnpm/action-setup only covers pnpm <= 10.
      - uses: pnpm/setup@v3.0.0
        with:
          version: 12
          runtime: node@26
          cache: true
      - run: pnpm run build
      # Zero-dependency sanity check of dist/: every inline JSON-LD and
      # speculation-rules block parses, every internal link/asset/sitemap
      # <loc>/feed href resolves to a built file, every page has lang/title/
      # canonical. Catches a broken hreflang twin or a typo'd href before deploy.
      - run: pnpm run check
      # IndexNow wants only what changed. Diff the live sitemap (= the previous
      # deploy: runs of this workflow are serialized per ref) against the one
      # just built: new and removed URLs plus every URL whose <lastmod> moved.
      # <lastmod> is the git "content last changed" date (page-lastmod.js), so
      # a Dependabot bump, a CSS tweak or a CI edit yields [] and the deploy
      # pings nothing. No live sitemap (first deploy, fetch failure) or the
      # indexnow_all input submits everything. The ?run= query sidesteps the
      # Pages CDN cache. Runs on PRs too, so a PR's log shows what its merge
      # would submit. Never blocks the build.
      - name: URLs changed since the live deploy
        id: indexnow
        continue-on-error: true
        env:
          ALL: ${{ inputs.indexnow_all }}
        run: |
          if [ "$ALL" = "true" ] || ! curl -sf --retry 2 "https://tsv.one/sitemap.xml?run=$GITHUB_RUN_ID" -o live-sitemap.xml; then
            rm -f live-sitemap.xml
          fi
          urls=$(node scripts/indexnow-urls.js live-sitemap.xml dist/sitemap.xml)
          echo "urls=$urls" >> "$GITHUB_OUTPUT"
          echo "IndexNow URLs for this deploy: $urls"
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist
          # without this the artifact silently drops dist/.well-known
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      # Tell IndexNow-participating engines (Bing, Yandex, Seznam, ...) which
      # pages changed: the list the build job diffed out of the sitemaps, and
      # nothing at all when it's empty. Best-effort: a failed ping must not
      # fail the deploy. The key is public by design (served at keyLocation).
      - name: Ping IndexNow
        if: needs.build.outputs.indexnow-urls != '' && needs.build.outputs.indexnow-urls != '[]'
        continue-on-error: true
        env:
          URLS: ${{ needs.build.outputs.indexnow-urls }}
        run: |
          key=ec5433724775ed2bbe6e7d5ea943683d
          jq -nc --arg key "$key" --argjson urls "$URLS" \
            '{host: "tsv.one", key: $key, keyLocation: ("https://tsv.one/" + $key + ".txt"), urlList: $urls}' > indexnow.json
          echo "Submitting: $URLS"
          curl -sS --fail-with-body -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' --data @indexnow.json
